name = "progress-report-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Sve što nije "iskljucen" znači da je probni režim uključen. wrangler deploy ovu vrijednost
# prepisuje preko one na Cloudflare-u, pa se isključuje samo ovdje, u #32.
[vars]
PROBNI_REZIM = "iskljucen"

# Po UTC-u. Lokalno vrijeme Worker računa sam, pa 23:40 i 1:00 ne zavise od ljetnjeg i zimskog vremena.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "progress-report-worker"
# Upisuje se u #25, poslije `wrangler d1 create`. Dok je ovako, objava pada.
database_id = "8b997196-2371-46e5-a575-6b7aaa01b616"
migrations_dir = "migrations"
