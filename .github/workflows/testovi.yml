name: Testovi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testovi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Pokreni testove
        run: python -m pytest -v
